
# DocuRAG 持续集成：独立数据库、迁移验证和自动化测试。
name: DocuRAG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docurag
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: docurag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docurag -d docurag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      APP_ENV: test
      AUTH_ENABLED: "false"
      LLM_PROVIDER: mock
      DATABASE_URL: postgresql+psycopg://docurag:ci_test_password@localhost:5432/docurag_test
      TEST_DATABASE_URL: postgresql+psycopg://docurag:ci_test_password@localhost:5432/docurag_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://docurag:ci_test_password@localhost:5432/docurag_test
      REDIS_URL: redis://localhost:6379/0
      ENV_FILE: /dev/null
      PYTHONPATH: .

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: |
          python -m compileall -q app scripts tests alembic

      - name: Apply database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Verify migration head
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os

          engine = create_engine(
              os.environ["TEST_DATABASE_URL"]
          )

          with engine.connect() as conn:
              version = conn.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()

              extension = conn.execute(
                  text(
                      "SELECT EXISTS ("
                      "SELECT 1 FROM pg_extension "
                      "WHERE extname = 'pg_trgm'"
                      ")"
                  )
              ).scalar_one()

          assert version == "ef77a147eea7", version
          assert extension is True
          print("Migration and pg_trgm: PASS")

          engine.dispose()
          PY

      - name: Run automated tests
        run: |
          python -m scripts.run_tests -q --tb=short
